<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鼠鼠模拟器 - Demo 模式</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1b1f28;
      --panel-2: #252b36;
      --text: #f6f0e6;
      --muted: #b8afa2;
      --line: rgba(255, 255, 255, .14);
      --accent: #8dd6ff;
      --warn: #ffd166;
      --good: #7bd88f;
      --bad: #ff7a6c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 10% 8%, rgba(141, 214, 255, .12), transparent 28rem),
        radial-gradient(circle at 92% 88%, rgba(255, 209, 102, .1), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .game {
      width: min(100vw, 530px);
      min-height: 100vh;
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.018));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 13px; }

    .primary {
      min-width: 86px;
      padding: 10px 13px;
      border-radius: 8px;
      background: var(--accent);
      color: #071016;
      font-weight: 800;
      box-shadow: 0 9px 26px rgba(141, 214, 255, .18);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025)),
        rgba(12, 14, 19, .56);
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 12px 30px rgba(0,0,0,.18);
    }

    .stat {
      position: relative;
      overflow: hidden;
      min-height: 70px;
      padding: 9px 10px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background:
        linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.018) 58%),
        rgba(27, 31, 40, .9);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    .stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 0 999px 999px 0;
      background: var(--tone, var(--accent));
      opacity: .9;
    }

    .stat::after {
      content: attr(data-icon);
      position: absolute;
      right: 8px;
      top: 7px;
      color: var(--tone, var(--accent));
      font-size: 14px;
      font-weight: 900;
      opacity: .72;
    }

    .stat-date { --tone: var(--warn); }
    .stat-work { --tone: #8dd6ff; }
    .stat-salary { --tone: #b9fbc0; }
    .stat-cash { --tone: #ffd166; }
    .stat-hair { --tone: #d4bfff; }
    .stat-mood { --tone: #ffafcc; }
    .stat-peer { --tone: #9bf6ff; }
    .stat-clean { --tone: #cbd5e1; }

    .stat.is-muted {
      opacity: .48;
      filter: grayscale(.8);
    }

    .stat-date {
      background:
        linear-gradient(160deg, rgba(255,209,102,.16), rgba(255,255,255,.018) 58%),
        rgba(27, 31, 40, .9);
    }

    .label {
      padding-right: 16px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.2;
    }

    .value {
      margin-top: 7px;
      color: #fffaf0;
      font-size: 22px;
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-wrap: balance;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
    }

    .stat-date .value {
      color: var(--warn);
      font-size: 19px;
      line-height: 1.15;
      white-space: pre-line;
    }

    .stat-salary,
    .stat-cash {
      grid-column: span 1;
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, transparent 31px, rgba(255,255,255,.045) 32px),
        linear-gradient(0deg, transparent 31px, rgba(255,255,255,.035) 32px),
        #171a21;
      background-size: 32px 32px;
      min-height: 510px;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .stage-title {
      padding: 12px 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .mode {
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: var(--warn);
      white-space: nowrap;
    }

    .board {
      position: relative;
      height: min(72vh, 482px);
      min-height: 450px;
    }

    .hole {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 62px;
      height: 62px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 55%, #000 0 34%, #16181e 35% 49%, #303541 50% 58%, rgba(255,255,255,.09) 59% 65%, transparent 66%);
      transition: filter .15s ease, scale .15s ease;
    }

    .hole::before {
      content: attr(data-name);
      position: absolute;
      bottom: -22px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .hole:not(.blocked):not(.current):hover { filter: brightness(1.18); scale: 1.04; }

    .hole.exit {
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(123,216,143,.22), rgba(123,216,143,.06)), #101911;
      border: 2px solid rgba(123,216,143,.55);
    }

    .hole.exit::after {
      content: "出口";
      color: var(--good);
      font-weight: 900;
      font-size: 13px;
    }

    .hole.blocked {
      background:
        radial-gradient(circle at 45% 38%, #d1d5db 0 18%, #9ca3af 19% 38%, #6b7280 39% 55%, #353b45 56% 70%, transparent 71%);
      cursor: default;
    }

    .hole.blocked::after {
      content: "";
      position: absolute;
      inset: 18px 13px 12px 14px;
      border-radius: 45% 55% 47% 53%;
      background: rgba(255,255,255,.16);
      transform: rotate(-18deg);
    }

    .hole.current { outline: 3px solid rgba(255,209,102,.74); outline-offset: 4px; }

    .crawler {
      position: absolute;
      left: var(--cx);
      top: var(--cy);
      width: 76px;
      height: 50px;
      transform: translate(-50%, -50%);
      z-index: 6;
      pointer-events: none;
      transition: left .72s cubic-bezier(.2,.8,.2,1), top .72s cubic-bezier(.2,.8,.2,1), rotate .72s ease;
    }

    .mouse {
      position: relative;
      left: 14px;
      top: 11px;
      width: 48px;
      height: 28px;
      border-radius: 48% 56% 48% 52%;
      background:
        radial-gradient(circle at 30% 36%, rgba(255,255,255,.24) 0 8%, transparent 9%),
        linear-gradient(90deg, #bd8b64, #7d573f);
      box-shadow: inset 9px 0 rgba(255,255,255,.1), 0 8px 16px rgba(0,0,0,.3);
    }

    .ears {
      position: absolute;
      left: 4px;
      top: -7px;
      display: flex;
      gap: 20px;
      pointer-events: none;
    }

    .ears i {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle, #f0b3a0 0 38%, #9b6a4d 40% 100%);
      border: 1px solid rgba(0,0,0,.15);
    }

    .eyes { position: absolute; top: 8px; left: 12px; display: flex; gap: 12px; }
    .eyes i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #1f1714;
      box-shadow: 0 0 0 1px rgba(255,255,255,.35);
    }

    .cheeks {
      position: absolute;
      left: 8px;
      right: 12px;
      top: 18px;
      display: flex;
      justify-content: space-between;
    }

    .cheeks i {
      width: 7px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,139,139,.58);
    }

    .nose {
      position: absolute;
      right: 4px;
      top: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2b1a18;
    }

    .whiskers {
      position: absolute;
      right: -12px;
      top: 12px;
      width: 24px;
      height: 12px;
      pointer-events: none;
    }

    .whiskers i {
      position: absolute;
      left: 0;
      width: 24px;
      height: 1px;
      background: rgba(238,205,180,.78);
      transform-origin: left center;
    }

    .whiskers i:nth-child(1) { top: 1px; rotate: -15deg; }
    .whiskers i:nth-child(2) { top: 6px; }
    .whiskers i:nth-child(3) { top: 11px; rotate: 15deg; }

    .tail {
      position: absolute;
      left: -24px;
      top: 14px;
      width: 31px;
      height: 15px;
      border-bottom: 3px solid #d39a8d;
      border-radius: 50%;
      transform-origin: right center;
    }

    .feet { position: absolute; inset: 0; }
    .feet i {
      position: absolute;
      width: 9px;
      height: 5px;
      border-radius: 99px;
      background: #6e4935;
      transform-origin: center;
    }

    .feet i:nth-child(1) { left: 10px; top: 23px; rotate: 12deg; animation-delay: 0s; }
    .feet i:nth-child(2) { left: 27px; top: 24px; rotate: -8deg; animation-delay: -.12s; }
    .feet i:nth-child(3) { left: 12px; top: 1px; rotate: -12deg; animation-delay: -.12s; }
    .feet i:nth-child(4) { left: 29px; top: 2px; rotate: 8deg; animation-delay: 0s; }

    .crawler.moving .mouse { animation: mouseRun .24s infinite alternate; }
    .crawler.moving .ears i { animation: earBounce .32s infinite ease-in-out alternate; }
    .crawler.moving .tail { animation: tailSwing .26s infinite ease-in-out alternate; }
    .crawler.moving .feet i { animation: footRun .18s infinite ease-in-out alternate; }

    @keyframes mouseRun {
      from { translate: -1px 0; rotate: -1deg; }
      to { translate: 2px 1px; rotate: 2deg; }
    }

    @keyframes footRun {
      from { translate: -3px 0; scale: 1 1; }
      to { translate: 3px 0; scale: .72 1; }
    }

    @keyframes tailSwing {
      from { rotate: -12deg; }
      to { rotate: 14deg; }
    }

    @keyframes earBounce {
      from { translate: 0 0; }
      to { translate: 0 -2px; }
    }

    .shop {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .shop-grid {
      width: min(100%, 386px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(0,0,0,.2);
      touch-action: none;
    }

    .tile {
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px;
      min-width: 0;
      font-weight: 850;
      color: #17120c;
      box-shadow: inset 0 -4px rgba(0,0,0,.12);
    }

    .tile.empty {
      background: rgba(255,255,255,.07);
      box-shadow: none;
    }

    .tile span {
      display: block;
      line-height: 1.18;
      font-size: clamp(12px, 3vw, 16px);
      overflow-wrap: anywhere;
    }

    .tile small {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      opacity: .72;
    }

    .overtime {
      height: 100%;
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 22px;
    }

    .work-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12,14,19,.76);
      line-height: 1.55;
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    .choice {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: var(--panel-2);
      text-align: left;
      line-height: 1.45;
    }

    .hint-panel {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27,31,40,.86);
      line-height: 1.5;
    }

    .hint-title { margin-bottom: 4px; color: var(--warn); font-weight: 800; }
    .hint-text { min-height: 42px; color: var(--muted); font-size: 14px; }

    .result {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(8,9,12,.78);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .result.show { display: grid; }

    .card {
      width: min(100%, 360px);
      max-height: calc(100% - 24px);
      overflow: auto;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: #1a1e27;
      box-shadow: 0 20px 70px rgba(0,0,0,.38);
    }

    .card h2 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 8px 0; color: var(--muted); line-height: 1.55; }

    .achievement-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .achievement-list:empty { display: none; }

    .achievement-card {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(255,255,255,.045);
    }

    .achievement-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255,209,102,.14);
      color: var(--warn);
      font-weight: 900;
    }

    .achievement-name {
      color: var(--text);
      font-weight: 850;
      font-size: 14px;
      line-height: 1.25;
    }

    .achievement-desc {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .again {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--warn);
      color: #181006;
      font-weight: 850;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(0,0,0,.74);
      color: var(--text);
      font-size: 13px;
      opacity: 0;
      transition: opacity .2s ease, translate .2s ease;
      pointer-events: none;
      z-index: 12;
    }

    .toast.show { opacity: 1; translate: 0 -6px; }

    .hidden { display: none !important; }

    .menu-screen,
    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 20% 18%, rgba(141,214,255,.16), transparent 24rem),
        radial-gradient(circle at 84% 88%, rgba(255,209,102,.13), transparent 24rem),
        rgba(10, 11, 15, .94);
    }

    .menu-card,
    .modal-card {
      width: min(100%, 390px);
      padding: 20px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: #1a1e27;
      box-shadow: 0 20px 70px rgba(0,0,0,.38);
    }

    .menu-card h2,
    .modal-card h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .menu-card p,
    .modal-card p {
      margin: 8px 0 14px;
      color: var(--muted);
      line-height: 1.55;
    }

    #resultCopy {
      white-space: pre-line;
    }

    .menu-actions {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .menu-btn {
      padding: 12px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.12);
      font-weight: 800;
    }

    .menu-btn.primary-action {
      background: var(--accent);
      color: #071016;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .switch {
      width: 48px;
      height: 26px;
      border-radius: 99px;
      background: rgba(255,255,255,.16);
      padding: 3px;
    }

    .switch i {
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text);
      transition: translate .16s ease;
    }

    .switch.on {
      background: rgba(123,216,143,.55);
    }

    .switch.on i {
      translate: 22px 0;
    }

    .day-scene {
      height: 100%;
      display: grid;
      align-content: center;
      gap: 12px;
      padding: 22px;
    }

    .scene-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12,14,19,.76);
      line-height: 1.55;
    }

    .scene-kicker {
      color: var(--warn);
      font-weight: 850;
      margin-bottom: 6px;
    }

    @media (max-width: 430px) {
      .game { padding: 12px; }
      .stats {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 6px;
      }
      .stat { min-height: 64px; padding: 8px 8px 9px; }
      .label { font-size: 10px; }
      .value { font-size: 19px; }
      .stat-date .value { font-size: 17px; }
      .hole { width: 56px; height: 56px; }
      .tile span { font-size: 12px; }
    }
  </style>
</head>
<body>
  <section class="menu-screen" id="menuScreen">
    <div class="menu-card">
      <h2>鼠鼠模拟器 Demo</h2>
      <p>试玩版只跑 9 月一个月。事件池和正式版一致，但结局阈值会压缩到一个月内可验证。</p>
      <div class="menu-actions">
        <button class="menu-btn primary-action" id="newGameBtn">新游戏</button>
        <button class="menu-btn" id="continueBtn">继续存档</button>
        <button class="menu-btn" id="settingsBtn">设置</button>
      </div>
    </div>
  </section>

  <section class="modal hidden" id="settingsModal">
    <div class="modal-card">
      <h2>设置</h2>
      <div class="setting-row">
        <span>跳过新手引导</span>
        <button class="switch" id="skipTutorialBtn" aria-label="跳过新手引导"><i></i></button>
      </div>
      <div class="setting-row">
        <span>清除本地存档</span>
        <button class="menu-btn" id="clearSaveBtn">清除</button>
      </div>
      <button class="menu-btn primary-action" id="closeSettingsBtn">返回</button>
    </div>
  </section>

  <section class="modal hidden" id="tutorialModal">
    <div class="modal-card">
      <h2 id="tutorialTitle">新手引导</h2>
      <p id="tutorialText"></p>
      <button class="menu-btn primary-action" id="tutorialNextBtn">下一步</button>
    </div>
  </section>

  <main class="game hidden" id="game" aria-label="鼠鼠模拟器 Demo 模式">
    <section class="topbar">
      <div>
        <h1>鼠鼠模拟器 Demo</h1>
        <div class="subtitle">一个月试玩 · 广东大厂运营岗</div>
      </div>
      <div class="top-actions">
        <button class="primary" id="saveExitBtn">存档退出</button>
      </div>
    </section>

    <section class="stats" aria-live="polite">
      <div class="stat stat-date" data-icon="日"><div class="label">日期</div><div class="value" id="monthText">9月 1日 周一</div></div>
      <div class="stat stat-work" data-icon="评"><div class="label" id="stat2Label">上级评价</div><div class="value" id="stat2Text">50</div></div>
      <div class="stat stat-salary" data-icon="薪"><div class="label" id="stat3Label">预估工资</div><div class="value" id="stat3Text">8500</div></div>
      <div class="stat stat-cash" data-icon="¥"><div class="label">现金</div><div class="value" id="cashText">4000</div></div>
      <div class="stat stat-hair" data-icon="发"><div class="label">发量</div><div class="value" id="healthText">75</div></div>
      <div class="stat stat-mood" data-icon="心"><div class="label">心态</div><div class="value" id="moodText">70</div></div>
      <div class="stat stat-peer" data-icon="友"><div class="label">同事印象</div><div class="value" id="peerText">60</div></div>
      <div class="stat stat-clean" data-icon="净"><div class="label">整洁</div><div class="value" id="cleanText">65</div></div>
    </section>

    <section class="stage">
      <div class="stage-title">
        <span id="eventTitle">9月 1日</span>
        <span class="mode" id="modeText">工作时间</span>

    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return memoryStorage[key] || null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        memoryStorage[key] = value;
      }
    }

    function storageRemove(key) {
      try {
        localStorage.removeItem(key);
      } catch {
        delete memoryStorage[key];
      }
    }

    function currentEvent() {
      return schedule[state.month - 1].night;
    }

    function currentMonth() {
      return schedule[state.month - 1];
    }

    function render() {
      const month = currentMonth();
      clearBoard();
      if (state.cash < 0) return showBankruptcyResult();
      document.getElementById("monthText").textContent = dateText();
      document.getElementById("stat2Text").textContent = state.work;
      document.getElementById("cashText").textContent = state.cash;
      document.getElementById("healthText").textContent = state.health;
      document.getElementById("moodText").textContent = state.mood;
      document.getElementById("peerText").textContent = state.peer;
      document.getElementById("cleanText").textContent = state.clean;
      document.getElementById("result").classList.remove("show");
      state.done = false;

      applyDailyMealCost();
      if (state.cash < 0) return showBankruptcyResult();
      applyDailyAnxiety();
      if (state.phase === "monthEnd") return renderMonthEnd();
      if (state.phase === "weekend") return renderWeekendEvent();
      if (state.phase === "life") return renderLifeEvent();
      if (state.phase === "dayWork") return renderDayWorkEvent();
      if (state.phase === "tea") return renderTeaEvent();
      if (state.phase === "toNight") {
        document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
        document.getElementById("modeText").textContent = "准备";
        setHint("夜晚", "点击下方按钮进入本月夜晚事件。");
        showResult("夜晚开始", "白天事件已结束", "电脑合上之后，出租屋和生活会接着出题。");
        document.getElementById("againBtn").textContent = "进入夜晚";
        return;
      }

      const event = currentEvent();
      document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
      document.getElementById("modeText").textContent = modeName(event.type);
      document.getElementById("result").classList.remove("show");
      state.done = false;

      if (state.nightMouse) {
        document.getElementById("modeText").textContent = "抓老鼠";
        return renderMouse(!state.mouse.level);
      }
      renderNightEvent();
      saveGame();
    }

      return { night: "夜晚选择", mouse: "抓鼠鼠", shop: "超市抢购", work: "加班" }[type];
    }

      renderChoiceScene(event.body, event.choices, (text, workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta) => {

      document.getElementById("stat3Label").textContent = "预估工资";

      setHint("周末", "周末可以花钱提高生活质量、心态和发量，也可以省钱但恢复较少。");

        state.phase = "dayEnd";
        saveGame();
        showResult("周末事件结束", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta), `你选择了“${text}”。周末不是暂停键，只是另一种消耗和恢复。`);
        if (state.phase === "bankrupt") return;
        document.getElementById("againBtn").textContent = state.day >= DAYS_PER_MONTH ? "月末结算" : "进入下一天";
      });
      saveGame();
    }

    function applyDailyMealCost() {
      if (!["life", "dayWork", "weekend"].includes(state.phase)) return;
      const key = `${state.month}-${state.day}`;
      if (state.mealDayKey === key) return;
      state.cash += monthlyBills.dailyMeal;
      state.mealDayKey = key;
      setHint("日常饭钱", "今天吃饭预留 25 元，现金 -25。");
      saveGame();
    }

    function applyDailyAnxiety() {
      if (!["life", "dayWork", "weekend"].includes(state.phase)) return;
      const key = `${state.month}-${state.day}`;
      if (state.anxietyDayKey === key) return;
      if (state.cash < nextMonthHousingCost()) {
        state.mood = clamp(state.mood - 1, 0, 100);
        state.anxietyDayKey = key;
        setHint("余额焦虑", "现金低于下月房租水电预备金，今天心态 -1。");
        saveGame();
      }
    }

    function nextMonthHousingCost() {
      return Math.abs(monthlyBills.rent) + Math.abs(monthlyBills.utilities);
    }

    function renderMonthEnd() {
      document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
      document.getElementById("modeText").textContent = "账单";
      document.getElementById("stat3Label").textContent = "本月工资";
      document.getElementById("stat3Text").textContent = monthlySalary();
      updateStatsOnly();
      setHint("月末结算", "每个月结束后发工资，再扣房租水电。每天饭钱已经在当天扣除，随机收支与低数值惩罚也会在这里结算。");
      const summary = settleMonthEnd();
      showResult("月末结算", summary.meta, summary.copy);
      if (state.phase === "bankrupt") return;
      document.getElementById("againBtn").textContent = state.phase === "fired" ? "回到主界面" : state.month >= schedule.length ? "完成试用期" : "进入下个月";
    }

    function renderDayWorkEvent() {
      const data = dayWorkEvents[ensureWorkIndex()];
      if (!data) {
        scheduleTeaAfterWork();
        saveGame();
        render();
        return;
      }
      document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
      document.getElementById("modeText").textContent = "工作时间";
      document.getElementById("stat3Label").textContent = "预估工资";
      document.getElementById("stat3Text").textContent = projectedSalary();
      updateStatsOnly();
      setHint("工作时间", "选择运营岗白天的处理方式。晚上会进入本月夜晚事件。");
      renderChoiceScene(data.body, data.choices, (text, workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta) => {
        applyDelta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta);
        scheduleTeaAfterWork();
        state.nightMonth = null;
        saveGame();
        showResult("工作事件结束", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta), `你选择了“${text}”。`);

        document.getElementById("againBtn").textContent = state.phase === "tea" ? "去茶水间" : "进入夜晚";
      });
      saveGame();
    }

    function scheduleTeaAfterWork() {
      state.teaIndex = pickTeaIndex(state.month);
      state.phase = state.teaIndex === null ? "toNight" : "tea";
    }

    function renderTeaEvent() {
      const event = teaEvents[state.teaIndex];
      if (!event) {
        state.phase = "toNight";
        saveGame();
        render();
        return;
      }
      document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
      document.getElementById("modeText").textContent = "茶水间";
      document.getElementById("stat3Label").textContent = "预估工资";
      document.getElementById("stat3Text").textContent = projectedSalary();
      updateStatsOnly();
      setHint("茶水间", "摸鱼不是单纯休息，也可能影响你在同事眼里的形象。");
      renderChoiceScene(event.body, event.choices, (text, workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta) => {
        applyDelta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta);
        state.phase = "toNight";
        state.nightMonth = null;
        saveGame();
        showResult("茶水间事件结束", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta), `你选择了“${text}”。同事印象有时比日报更难改。`);
        if (state.phase === "bankrupt") return;
        document.getElementById("againBtn").textContent = "进入夜晚";
      });
      saveGame();
    }

    function renderNightEvent() {
      const event = nightEvents[state.nightIndex];
      if (!event) {
        showResult("平静夜晚", "没有新的夜晚事件", "今晚没有新的突发状况。你把出租屋简单收拾了一下，尽量早点睡。");
        return;
      }
      const choices = availableNightChoices(event);
      document.getElementById("eventTitle").textContent = `${currentMonth().label} ${state.day}日`;
      document.getElementById("modeText").textContent = "夜晚";
      document.getElementById("stat3Label").textContent = "预估工资";
      document.getElementById("stat3Text").textContent = projectedSalary();
      updateStatsOnly();
      setHint("夜晚选择", nightChoiceHint(choices.length));
      renderChoiceScene(nightBody(event.body, choices.length), choices, (text, workDelta, moodDelta, cashDelta, peerDelta, healthDelta) => {
        const previousClean = state.clean;
        const cleanDelta = choiceCleanDelta(text, event);
        const isHousework = nightChoiceType(event, text) === "housework";
        applyDelta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta);
        saveGame();
        if (isHousework && previousClean < 25 && Math.random() < 0.42) {
          state.nightMouse = true;
          state.mouse = {};
          saveGame();
          showResult("家务做到一半", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta), "你拖开纸箱时，角落里突然窜出一只小老鼠。房间太乱的时候，生活会主动加戏。");
          document.getElementById("againBtn").textContent = "抓老鼠";
          return;
        }
        showResult("夜晚结束", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta), `你选择了“${text}”。夜晚的选择会累积成第二天的状态。`);
      });
      saveGame();
    }

    function availableNightChoices(event) {
      if (state.clean < 25) return event.choices.filter((choice) => nightChoiceType(event, choice[0]) === "housework");
      if (state.lastLifeTag === "回南天") return event.choices.filter((choice) => nightChoiceType(event, choice[0]) === "housework");
      if (state.lastLifeTag === "台风") return event.choices.filter((choice) => nightChoiceType(event, choice[0]) !== "outing");
      if (state.health < 25) return event.choices.filter((choice) => nightChoiceType(event, choice[0]) !== "outing");
      return event.choices;
    }

    function nightChoiceHint(count) {
      if (state.clean < 25) return "出租屋太乱了，今晚必须先做家务。整洁度太低时还有几率触发抓老鼠。";
      if (state.lastLifeTag === "回南天") return "白天回南天把被子和衣服都闷出味了，今晚只能先做家务收拾。";
      if (state.lastLifeTag === "台风") return "台风天不适合出门，今晚只能在出租屋里处理生活或工作。";
      if (state.health < 25) return "发量太危险，今晚不适合再出门折腾。";
      return "晚上从家务、加班、出去玩里选一个方向。选择会影响明天触发什么事件。";
    }

    function nightBody(body, count) {
      if (count > 1) return body;
      return `${body}<br><br>但白天的生活事件把今晚的余地压没了，你现在只能先处理最现实的问题。`;
    }

    function nightChoiceType(event, text) {
      const index = event.choices.findIndex(([choiceText]) => choiceText === text);
      if (index === 0) return "housework";
      if (index === 1) return "overtime";
      if (index === 2) return "outing";
      return "other";
    }

    function choiceCleanDelta(text, event = nightEvents[state.nightIndex]) {
      const choice = event.choices.find(([choiceText]) => choiceText === text);
      if (typeof choice?.[6] === "number") return choice[6];
      const type = nightChoiceType(event, text);
      if (type === "housework") return 8;
      if (type === "overtime") return -8;
      if (type === "outing") return -8;
      return 0;
    }

    function renderChoiceScene(body, choices, onPick) {
      const wrap = document.createElement("div");
      wrap.className = "day-scene";
      const card = document.createElement("div");
      card.className = "scene-card";
      card.innerHTML = `<div class="scene-kicker">${currentMonth().label}</div>${body}`;
      const choiceWrap = document.createElement("div");
      choiceWrap.className = "choices";
      choices.forEach(([text, workDelta, moodDelta, cashDelta, peerDelta = 0, healthDelta = 0, cleanDelta = 0]) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = text;
        button.addEventListener("click", () => onPick(text, workDelta, moodDelta, cashDelta, peerDelta, healthDelta, cleanDelta));
        choiceWrap.appendChild(button);
      });
      wrap.appendChild(card);
      wrap.appendChild(choiceWrap);
      board.appendChild(wrap);
    }

    function renderMouse(reset = false) {
      const event = currentEvent();
      const level = state.nightMouse
        ? mouseLevels[Math.min(mouseLevels.length - 1, Math.floor((state.month - 1) / 4))]
        : mouseLevels[event.mouse];
      if (reset) {
        state.mouse = {
          level,
          stones: level.stones,
          turn: 1,
          current: level.start,
          blocked: new Set(),
          moving: false,
          path: [level.start]
        };
        setHint("规则", "每回合点一个空洞放石子，观察鼠鼠的跑动习惯，封住关键洞，把它赶到绿色出口。");
      }

      const mouse = state.mouse;
      document.getElementById("stat3Label").textContent = "回合";
      document.getElementById("stat3Text").textContent = mouse.turn;
      updateStatsOnly();

      Object.entries(level.holes).forEach(([id, hole]) => {
        const button = document.createElement("button");
        button.className = "hole";
        button.style.setProperty("--x", `${hole.x}%`);
        button.style.setProperty("--y", `${hole.y}%`);
        button.dataset.name = hole.name;
        button.setAttribute("aria-label", `${hole.name}${hole.exit ? "出口" : "洞"}`);
        if (hole.exit) button.classList.add("exit");
        if (mouse.blocked.has(id)) button.classList.add("blocked");
        if (mouse.current === id && !hole.exit) button.classList.add("current");
        button.addEventListener("click", () => placeStone(id));
        board.appendChild(button);
      });

      const current = level.holes[mouse.current] || level.holes[level.start];
      crawler.style.setProperty("--cx", `${current.x}%`);
      crawler.style.setProperty("--cy", `${current.y}%`);
      crawler.style.display = mouse.current === "X" || state.done ? "none" : "block";
      crawler.classList.toggle("moving", mouse.moving);
    }

    function placeStone(id) {
      const mouse = state.mouse;
      const level = mouse.level;
      const holes = level.holes;
      if (state.done || mouse.moving) return;
      if (holes[id].exit) return showToast("出口不能堵，不然今晚大家都出不去。");
      if (id === mouse.current) return showToast("鼠鼠正在这个洞里，石子放下去只会让你更慌。");
      if (mouse.blocked.has(id)) return showToast("这个洞已经堵住了。");
      if (mouse.stones <= 0) return showToast("没有石子了，只能看鼠鼠自由发挥。");

      mouse.blocked.add(id);
      mouse.stones -= 1;
      setHint("你放下石子", `你堵住了「${holes[id].name}」。没有路线提示，只能靠观察它的下一步。`);
      clearBoard();
      renderMouse(false);
      saveGame();
      setTimeout(moveMouse, 420);
    }

    function moveMouse() {
      const mouse = state.mouse;
      const level = mouse.level;
      const holes = level.holes;
      mouse.moving = true;
      clearBoard();
      renderMouse(false);

      const options = level.priorities[mouse.current].filter((id) => !mouse.blocked.has(id));
      if (!options.length) return finishMouse(false, "困在墙里", "你把鼠鼠堵在洞网深处了，但它没有被赶出来。出租屋安静了一会儿，随后你开始担心它是不是在里面囤粮。");

      const old = mouse.current;
      const next = options[0];
      mouse.current = next;
      mouse.path.push(next);
      animateCrawler(level, old, next);

      setTimeout(() => {
        if (next === "X") return finishMouse(true, "成功驱赶", "鼠鼠被赶到出口，抱着空气里的外卖味连夜离开。");
        mouse.turn += 1;
        state.mood -= 2;
        mouse.moving = false;
        const jump = getDistance(holes[old], holes[next]) > 38;
        setHint("它移动了", `鼠鼠从「${holes[old].name}」${jump ? "突然横穿" : "小跑"}到「${holes[next].name}」。${jump ? "它不一定去最近的洞，记住这种跳点。" : "记住这一步，下一次就能预判它。"}`);
        if (mouse.turn > level.maxTurns) return finishMouse(false, "驱赶失败", "石子没能形成有效压力，鼠鼠在洞网里跑出了一条通勤路线。今晚心态扣绩效。");
        if (mouse.stones <= 0) setTimeout(moveMouse, 650);
        else {
          clearBoard();
          renderMouse(false);
          saveGame();
        }
      }, 620);
    }

    function animateCrawler(level, from, to) {
      const oldHole = level.holes[from];
      const nextHole = level.holes[to];
      const angle = Math.atan2(nextHole.y - oldHole.y, nextHole.x - oldHole.x) * 180 / Math.PI;
      const jump = getDistance(oldHole, nextHole) > 38;
      crawler.style.rotate = `${angle}deg`;
      crawler.style.transitionDuration = jump ? ".45s" : ".72s";
      requestAnimationFrame(() => {
        crawler.style.setProperty("--cx", `${nextHole.x}%`);
        crawler.style.setProperty("--cy", `${nextHole.y}%`);
      });
    }

    function finishMouse(success, title, copy) {
      const level = state.mouse.level;
      const path = state.mouse.path.map((id) => level.holes[id].name).join(" → ");
      state.nightMouse = false;
      state.mouse = {};
      if (success) {
        state.mood = clamp(state.mood + 4, 0, 100);
        state.clean = clamp(state.clean + 6, 0, 100);
      } else {
        state.mood = clamp(state.mood - 5, 0, 100);
        state.clean = clamp(state.clean - 8, 0, 100);
      }
      showResult(title, `路径：${path} · 心态 ${success ? "+4" : "-5"} · 整洁度 ${success ? "+6" : "-8"}`, copy);
    }

    function renderShop(reset = false) {
      const event = currentEvent();
      if (reset) {
        state.shop = {
          grid: Array(16).fill(0),
          moves: event.moves,
          target: event.target,
          score: 0
        };
        spawnFood();
        spawnFood();
        setHint("规则", `上下左右滑动或按方向键。相同食物会合成，目标是合成「${foods[event.target].name}」。`);
      }

      document.getElementById("stat3Label").textContent = "目标";
      document.getElementById("stat3Text").textContent = foods[state.shop.target].name.slice(0, 2);
      updateStatsOnly();

      const wrap = document.createElement("div");
      wrap.className = "shop";
      const grid = document.createElement("div");
      grid.className = "shop-grid";
      grid.tabIndex = 0;
      state.shop.grid.forEach((value) => {
        const tile = document.createElement("div");
        tile.className = value ? "tile" : "tile empty";
        if (value) {
          tile.style.background = foods[value].color;
          tile.innerHTML = `<span>${foods[value].name}</span><small>${2 ** value}</small>`;
        }
        grid.appendChild(tile);
      });
      wrap.appendChild(grid);
      board.appendChild(wrap);
      setupShopInput(grid);
    }

    function setupShopInput(grid) {
      grid.focus();
      grid.onkeydown = (event) => {
        const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
        if (!map[event.key]) return;
        event.preventDefault();
        event.stopPropagation();
        moveShop(map[event.key]);
      };

      let start = null;
      grid.ontouchstart = (event) => {
        const t = event.touches[0];
        start = { x: t.clientX, y: t.clientY };
      };
      grid.ontouchend = (event) => {
        if (!start) return;
        const t = event.changedTouches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        moveShop(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
        start = null;
      };
    }

    function moveShop(dir) {
      if (state.done || state.shop.moves <= 0) return;
      const before = state.shop.grid.join(",");
      const result = slideGrid(state.shop.grid, dir);
      state.shop.grid = result.grid;
      state.shop.score += result.score;
      if (before === state.shop.grid.join(",")) return showToast("这个方向挪不动，购物车卡住了。");
      state.shop.moves -= 1;
      spawnFood();
      const max = Math.max(...state.shop.grid);
      setHint("抢购中", `当前最高合成：${foods[max].name}。剩余 ${state.shop.moves} 步。`);
      clearBoard();
      renderShop(false);
      saveGame();
      if (max >= state.shop.target) return finishShop(true);
      if (state.shop.moves <= 0 || !canMoveShop()) return finishShop(false);
    }

    function slideGrid(grid, dir) {
      const next = Array(16).fill(0);
      let score = 0;
      const lines = getLines(dir);
      lines.forEach((line) => {
        const values = line.map((idx) => grid[idx]).filter(Boolean);
        const merged = [];
        for (let i = 0; i < values.length; i += 1) {
          if (values[i] === values[i + 1]) {
            merged.push(values[i] + 1);
            score += 2 ** (values[i] + 1);
            i += 1;
          } else {
            merged.push(values[i]);
          }
        }
        line.forEach((idx, i) => next[idx] = merged[i] || 0);
      });
      return { grid: next, score };
    }

    function getLines(dir) {
      const lines = [];
      for (let i = 0; i < 4; i += 1) {
        if (dir === "left") lines.push([0,1,2,3].map((x) => i * 4 + x));
        if (dir === "right") lines.push([3,2,1,0].map((x) => i * 4 + x));
        if (dir === "up") lines.push([0,1,2,3].map((y) => y * 4 + i));
        if (dir === "down") lines.push([3,2,1,0].map((y) => y * 4 + i));
      }
      return lines;
    }

    function spawnFood() {
      const empty = state.shop.grid.map((v, i) => v ? null : i).filter((v) => v !== null);
      if (!empty.length) return;
      const index = empty[Math.floor(Math.random() * empty.length)];
      state.shop.grid[index] = Math.random() < .82 ? 1 : 2;
    }

    function canMoveShop() {
      if (state.shop.grid.some((v) => !v)) return true;
      return ["left", "right", "up", "down"].some((dir) => slideGrid(state.shop.grid, dir).grid.join(",") !== state.shop.grid.join(","));
    }

    function finishShop(success) {
      const max = Math.max(...state.shop.grid);
      if (success) {
        state.cash += 180;
        state.mood += 3;
        showResult("抢购成功", `最高：${foods[max].name} · 现金 +180 · 心态 +3`, "你在临期区打出一套合成连招，用比外卖便宜的预算凑出了一顿像样晚饭。");
      } else {
        state.cash -= 120;
        state.mood -= 3;
        showResult("抢购失败", `最高：${foods[max].name} · 现金 -120 · 心态 -3`, "购物车里塞满了零散小东西，结账时发现便宜没有想象中便宜。");
      }
    }

    function renderWork(reset = false) {
      const event = currentEvent();
      const data = workEvents[event.work];
      if (reset) setHint("规则", "选择一种加班处理方式。它会影响上级评价、现金和心态。");
      document.getElementById("stat3Label").textContent = "预估工资";
      document.getElementById("stat3Text").textContent = projectedSalary();
      updateStatsOnly();

      const wrap = document.createElement("div");
      wrap.className = "overtime";
      const card = document.createElement("div");
      card.className = "work-card";
      card.textContent = data.body;
      const choices = document.createElement("div");
      choices.className = "choices";
      data.choices.forEach(([text, workDelta, moodDelta, cashDelta, peerDelta = 0]) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = text;
        button.addEventListener("click", () => finishWork(text, workDelta, moodDelta, cashDelta, peerDelta));
        choices.appendChild(button);
      });
      wrap.appendChild(card);
      wrap.appendChild(choices);
      board.appendChild(wrap);
    }

    function finishWork(text, workDelta, moodDelta, cashDelta, peerDelta = 0, healthDelta = 0) {
      applyDelta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, -6);
      showResult("加班结束", deltaMeta(workDelta, moodDelta, cashDelta, peerDelta, healthDelta, -6), `你选择了“${text}”。运营岗的夜晚没有鼠鼠，但有群消息在桌面右上角闪。`);
    }

    function applyDelta(workDelta = 0, moodDelta = 0, cashDelta = 0, peerDelta = 0, healthDelta = 0, cleanDelta = 0) {
      let adjustedPeer = peerDelta;
      if (workDelta >= 7 && peerDelta <= 0) adjustedPeer -= 2;
      if (workDelta >= 5 && moodDelta <= -4 && peerDelta <= 0) adjustedPeer -= 1;
      state.work = clamp(state.work + workDelta, 0, 100);
      state.health = clamp(state.health + healthDelta, 0, 100);
      state.mood = clamp(state.mood + moodDelta, 0, 100);
      state.clean = clamp(state.clean + cleanDelta, 0, 100);
      state.cash += cashDelta;
      state.peer = clamp(state.peer + adjustedPeer, 0, 100);
      return adjustedPeer;
    }

    function deltaMeta(workDelta = 0, moodDelta = 0, cashDelta = 0, peerDelta = 0, healthDelta = 0, cleanDelta = 0) {
      let adjustedPeer = peerDelta;
      if (workDelta >= 7 && peerDelta <= 0) adjustedPeer -= 2;
      if (workDelta >= 5 && moodDelta <= -4 && peerDelta <= 0) adjustedPeer -= 1;
      return `上级评价 ${signed(workDelta)} · 发量 ${signed(healthDelta)} · 心态 ${signed(moodDelta)} · 现金 ${signed(cashDelta)} · 同事印象 ${signed(adjustedPeer)} · 整洁度 ${signed(cleanDelta)}`;
    }

    function compactEffects(workDelta = 0, moodDelta = 0, cashDelta = 0, peerDelta = 0, healthDelta = 0, cleanDelta = 0) {
      return [
        workDelta ? `表现${signed(workDelta)}` : "",
        healthDelta ? `发量${signed(healthDelta)}` : "",
        moodDelta ? `心态${signed(moodDelta)}` : "",
        cashDelta ? `现金${signed(cashDelta)}` : "",
        peerDelta ? `印象${signed(peerDelta)}` : "",
        cleanDelta ? `整洁${signed(cleanDelta)}` : ""
      ].filter(Boolean).join("，") || "状态稳定";
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function clearAchievementCards() {
      const list = document.getElementById("achievementList");
      if (list) list.innerHTML = "";
    }

    function renderAchievementCards(items) {
      const list = document.getElementById("achievementList");
      if (!list) return;
      list.innerHTML = "";
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "achievement-card";
        card.innerHTML = `
          <div class="achievement-icon">${item.icon}</div>
          <div>
            <div class="achievement-name">${item.title}</div>
            <div class="achievement-desc">${item.copy}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function showResult(title, meta, copy) {
      if (state.cash < 0) return showBankruptcyResult();
      state.done = true;
      clearAchievementCards();
      document.getElementById("resultTitle").textContent = title;
      document.getElementById("resultMeta").textContent = meta;
      document.getElementById("resultCopy").textContent = copy;
      document.getElementById("againBtn").textContent = resultButtonText();
      document.getElementById("result").classList.add("show");
      updateStatsOnly();
      saveGame();
    }

    function resultButtonText() {
      if (state.nightMouse) return "抓老鼠";
      if (state.phase === "bankrupt") return "回到主界面";
      if (state.phase === "fired") return "回到主界面";
      if (state.phase === "monthEnd") return state.month >= schedule.length ? "完成试用期" : "进入下个月";
      if (state.phase === "life") return "去公司上班";
      if (state.phase === "dayWork") return "去茶水间";
      if (state.phase === "tea") return "进入夜晚";
      if (state.phase === "dayEnd") return state.day >= DAYS_PER_MONTH ? "月末结算" : "进入下一天";
      if (state.phase === "toNight") return "进入夜晚";
      if (state.phase === "night") return state.day >= DAYS_PER_MONTH ? "月末结算" : "进入下一天";
      if (state.month >= schedule.length) return "完成试用期";
      return "进入下个月";
    }

    function nextStep() {
      if (!state.done) return;
      if (state.phase === "finished") {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("menuScreen").classList.remove("hidden");
        return;
      }
      if (state.phase === "fired" || state.phase === "bankrupt") {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("menuScreen").classList.remove("hidden");
        return;
      }
      if (state.nightMouse) {
        state.done = false;
        render();
        return;
      }
      if (state.phase === "monthEnd") {
        if (state.month >= schedule.length) {
          showYearEnd();
          return;
        }
        state.month += 1;
        startMonth();
        saveGame();
        render();
        return;
      }
      if (state.phase === "life" || state.phase === "dayWork" || state.phase === "tea" || state.phase === "weekend") {
        render();
        return;
      }
      if (state.phase === "dayEnd") {
        if (state.day >= DAYS_PER_MONTH) {
          state.phase = "monthEnd";
        } else {
          startNextDay();
        }
        saveGame();
        render();
        return;
      }
      if (state.phase === "toNight") {
        state.phase = "night";
        saveGame();
        render();
        return;
      }
      if (state.day >= DAYS_PER_MONTH) {
        state.phase = "monthEnd";
      } else {
        startNextDay();
      }
      saveGame();
      render();
    }

    function startMonth() {
      state.day = 1;
      state.phase = "life";
      state.lifeIndex = pickLifeIndex(state.month);
      state.workIndex = pickWorkIndex();
      state.teaIndex = null;
      state.weekendIndex = pickWeekendIndex();
      state.nightIndex = pickNightIndex(state.month);
      state.financeIndex = pickFinanceIndex();
      state.lastLifeTag = "";
      state.anxietyDayKey = "";
    }

    function startNextDay() {
      state.day += 1;
      state.phase = isWeekendDay() ? "weekend" : "life";
      state.lifeIndex = pickLifeIndex(state.month);
      state.workIndex = pickWorkIndex();
      state.teaIndex = null;
      state.weekendIndex = pickWeekendIndex();
      state.nightIndex = pickNightIndex(state.month);
      state.lastLifeTag = "";
    }

    function isWeekendDay() {
      return state.day % 7 === 6 || state.day % 7 === 0;
    }

    function weekdayText() {
      return ["周一", "周二", "周三", "周四", "周五", "周六", "周日"][(state.day - 1) % 7];
    }

    function dateText() {
      return `${currentMonth().label}\n${state.day}日\n${weekdayText()}`;
    }

      Object.assign(state, initialState());
      saveGame();
      render();
    }

    function initialState() {
      const fresh = {
        month: 1,
        day: 1,
        phase: "dayWork",
        workIndex: 0,
        usedWorkIndices: [0],
        lifeIndex: 0,
        usedLifeIndices: [],
        teaIndex: null,
        usedTeaIndices: [],
        weekendIndex: 0,
        usedWeekendIndices: [],
        nightIndex: 0,
        usedNightIndices: [],
        financeIndex: 0,

        commute: pickCommute(),

        peer: 60,
        clean: 65,

    }

    function settleMonthEnd() {
      if (state.monthlySettledMonth === state.month) {
        return { meta: "本月账单已结算", copy: "这个月的工资、房租水电和随机收支已经记账。深呼吸，准备进入下一段生活。" };
      }
      if (state.work < 25) {
        state.monthlySettledMonth = state.month;
        state.phase = "fired";
        storageRemove(saveKey);
        return {
          meta: `上级评价 ${state.work} · 未通过绩效沟通`,
          copy: "Demo 月末绩效沟通里，领导说你最近交付风险太高，岗位不再继续保留。试用期提前结束。"
        };
      }
      const financeEvent = monthlyFinanceEvents[state.financeIndex];
      const salary = monthlySalary();
      const fixedCash = salary + monthlyBills.rent + monthlyBills.utilities + monthlyBills.commuteMeal;
      const [workDelta, moodDelta, eventCashDelta, peerDelta, healthDelta, cleanDelta] = financeEvent
        ? financeEvent.delta
        : [0, 0, 0, 0, 0, 0];
      const penalty = monthlyPenalty();
      state.cash += fixedCash;
      applyDelta(workDelta + penalty.work, moodDelta + penalty.mood, eventCashDelta + penalty.cash, peerDelta + penalty.peer, healthDelta + penalty.health, cleanDelta + penalty.clean);
      state.monthlySettledMonth = state.month;
      const billText = `工资 +${salary} · 房租 ${monthlyBills.rent} · 水电网 ${monthlyBills.utilities} · 饭钱已按每日结算`;
      const eventText = financeEvent ? `${financeEvent.tag}：现金 ${signed(eventCashDelta)}` : "本月没有新的随机收支";
      const penaltyText = penalty.title ? ` · ${penalty.title}` : "";
      return {
        meta: `${billText} · ${eventText}${penaltyText}`,
        copy: `${financeEvent ? financeEvent.body : "这个月没有额外的人情、维修或补贴入账，账本安静得有点难得。"}${penalty.copy ? ` ${penalty.copy}` : ""}`
      };
    }

    function monthlySalary() {
      if (state.work >= 85) return 12500;
      if (state.work >= 70) return 10500;
      if (state.work >= 50) return 8500;
      if (state.work >= 30) return 6500;
      if (state.work >= 18) return 4200;
      return 0;
    }

    function projectedSalary() {
      return monthlySalary();
    }

          work: -2,

          peer: 0,
          health: -3,
          clean: -5
        };
      }
      return { title: "", copy: "", work: 0, mood: 0, cash: 0, peer: 0, health: 0, clean: 0 };
    }

    function pickLifeIndex(month, used = state.usedLifeIndices) {
      const monthLabel = schedule[month - 1].label;
      const seasonal = {
        "9月": [0, 2, 3, 5, 6, 8],
        "10月": [0, 1, 2, 6, 8, 11],
        "11月": [0, 1, 2, 6, 10, 11],
        "12月": [0, 1, 8, 9, 10, 11]
      }[monthLabel] || lifeEvents.map((_, index) => index);
      let weighted = seasonal.slice();
      if (state.commute === "near") weighted = weighted.filter((index) => ![1, 6].includes(index)).concat([8, 9]);
      if (state.commute === "far") weighted = weighted.concat([0, 1, 6, 10]);
      if (state.health < 45) weighted = weighted.concat([0, 2, 5, 7, 10]);
      let pool = [...new Set(weighted)].filter((index) => !used.includes(index));
      if (!pool.length) pool = lifeEvents.map((_, index) => index).filter((index) => !used.includes(index));
      if (!pool.length) {
        used.length = 0;
        pool = [...new Set(weighted)];
      }
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function ensureWorkIndex() {
      if (state.month === 1 && state.day === 1) return 0;
      if (typeof state.workIndex === "number" && state.workIndex >= 0 && state.workIndex !== 0) return state.workIndex;
      state.workIndex = pickWorkIndex();
      return state.workIndex;
    }

    function pickWorkIndex(used = state.usedWorkIndices) {
      if (state.month === 1 && state.day === 1) {
        if (!used.includes(0)) used.push(0);
        return 0;
      }
      const pool = dayWorkEvents
        .map((_, index) => index)
        .filter((index) => index !== 0 && !used.includes(index));
      if (!pool.length) {
        used.splice(0, used.length, 0);
        const resetPool = dayWorkEvents.map((_, index) => index).filter((index) => index !== 0);
        const picked = resetPool[Math.floor(Math.random() * resetPool.length)];
        used.push(picked);
        return picked;
      }
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function pickTeaIndex(month, used = state.usedTeaIndices) {
      if (used.length >= teaEvents.length) return null;
      if (Math.random() > 0.18) return null;
      let pool = teaEvents.map((_, index) => index).filter((index) => !used.includes(index));
      if (!pool.length) return null;
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function pickWeekendIndex(used = state.usedWeekendIndices) {
      let pool = weekendEvents.map((_, index) => index).filter((index) => !used.includes(index));
      if (!pool.length) {
        used.length = 0;
        pool = weekendEvents.map((_, index) => index);
      }
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function pickFinanceIndex(used = state.usedFinanceIndices) {
      let pool = monthlyFinanceEvents.map((_, index) => index).filter((index) => !used.includes(index));
      if (!pool.length) {
        used.length = 0;
        pool = monthlyFinanceEvents.map((_, index) => index);
      }
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function pickNightIndex(month, used = state.usedNightIndices, commute = state.commute, health = state.health) {
      let candidates = nightEvents
        .map((event, index) => ({ event, index }))
        .filter(({ event }) => !event.commute || event.commute === commute)
        .map(({ index }) => index);
      if (health < 45) candidates = candidates.concat([4]);
      if (state.cash < 600) candidates = candidates.concat([0, 5]);
      let pool = [...new Set(candidates)].filter((index) => !used.includes(index));
      if (!pool.length) {
        used.length = 0;
        pool = [...new Set(candidates)];
      }
      const picked = pool[Math.floor(Math.random() * pool.length)];
      used.push(picked);
      return picked;
    }

    function pickCommute() {
      const roll = Math.random();
      if (roll < 0.25) return "near";
      if (roll < 0.75) return "mid";
      return "far";
    }

    function commuteText() {
      return { near: "近", mid: "中", far: "远" }[state.commute] || "中";
    }

    function resetAllToMenu() {
      resetAll();
      document.getElementById("menuScreen").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      maybeTutorial();
    }

    function saveGame() {
      storageSet(saveKey, JSON.stringify(serializeState()));
      document.getElementById("continueBtn").disabled = false;
    }

    function serializeState() {
      return {
        month: state.month,
        day: state.day,
        phase: state.phase,
        workIndex: state.workIndex,
        usedWorkIndices: state.usedWorkIndices,
        lifeIndex: state.lifeIndex,
        usedLifeIndices: state.usedLifeIndices,
        teaIndex: state.teaIndex,
        usedTeaIndices: state.usedTeaIndices,
        weekendIndex: state.weekendIndex,
        usedWeekendIndices: state.usedWeekendIndices,
        nightIndex: state.nightIndex,
        usedNightIndices: state.usedNightIndices,
        financeIndex: state.financeIndex,
        usedFinanceIndices: state.usedFinanceIndices,
        commute: state.commute,
        lastLifeTag: state.lastLifeTag,
        anxietyDayKey: state.anxietyDayKey,
        mealDayKey: state.mealDayKey,
        cash: state.cash,
        health: state.health,
        mood: state.mood,
        work: state.work,
        peer: state.peer,
        clean: state.clean,
        monthlySettledMonth: state.monthlySettledMonth,
        nightMouse: state.nightMouse,
        nightMonth: state.nightMonth,
        done: state.done,
        saveVersion: state.saveVersion,
        mouse: state.mouse && state.mouse.level ? {
          levelIndex: mouseLevels.indexOf(state.mouse.level),
          stones: state.mouse.stones,
          turn: state.mouse.turn,
          current: state.mouse.current,
          blocked: [...state.mouse.blocked],
          moving: false,
          path: state.mouse.path || []
        } : {},
        shop: state.shop || {}
      };
    }

    function loadGame() {
      const raw = storageGet(saveKey);
      if (!raw) return false;
      try {
        const saved = JSON.parse(raw);
        Object.assign(state, initialState(), saved);
        if (state.phase === "monthStart") state.phase = "monthEnd";
        state.usedWorkIndices = Array.isArray(saved.usedWorkIndices) ? saved.usedWorkIndices : [0];
        state.usedLifeIndices = Array.isArray(saved.usedLifeIndices) ? saved.usedLifeIndices : [];
        state.usedTeaIndices = Array.isArray(saved.usedTeaIndices) ? saved.usedTeaIndices : [];
        state.usedWeekendIndices = Array.isArray(saved.usedWeekendIndices) ? saved.usedWeekendIndices : [];
        state.usedNightIndices = Array.isArray(saved.usedNightIndices) ? saved.usedNightIndices : [];
        state.usedFinanceIndices = Array.isArray(saved.usedFinanceIndices) ? saved.usedFinanceIndices : [];
        if (typeof state.day !== "number") state.day = 1;
        if (typeof state.workIndex !== "number") state.workIndex = ensureWorkIndex();
        if (typeof state.health !== "number") state.health = 75;
        if (typeof state.clean !== "number") state.clean = 65;
        if (typeof state.monthlySettledMonth !== "number") state.monthlySettledMonth = 0;
        state.nightMouse = Boolean(saved.nightMouse);
        if (!state.commute) state.commute = "mid";
        if (typeof state.lastLifeTag !== "string") state.lastLifeTag = "";
        if (typeof state.anxietyDayKey !== "string") state.anxietyDayKey = "";
        if (typeof state.mealDayKey !== "string") state.mealDayKey = "";
        if (typeof state.weekendIndex !== "number") state.weekendIndex = pickWeekendIndex(state.usedWeekendIndices);
        if (typeof state.nightIndex !== "number") state.nightIndex = pickNightIndex(state.month, state.usedNightIndices, state.commute, state.health);
        if (typeof state.financeIndex !== "number") state.financeIndex = pickFinanceIndex(state.usedFinanceIndices);
        if (saved.mouse && typeof saved.mouse.levelIndex === "number") {
          state.mouse = {
            ...saved.mouse,
            level: mouseLevels[saved.mouse.levelIndex],
            blocked: new Set(saved.mouse.blocked || []),
            moving: false
          };
        }
        document.getElementById("menuScreen").classList.add("hidden");
        document.getElementById("game").classList.remove("hidden");
        render();
        return true;
      } catch {
        return false;
      }
    }

    function loadSettings() {
      try {
        return JSON.parse(storageGet(settingsKey)) || { skipTutorial: false };
      } catch {
        return { skipTutorial: false };
      }
    }

    function saveSettings() {
      storageSet(settingsKey, JSON.stringify(settings));
      document.getElementById("skipTutorialBtn").classList.toggle("on", settings.skipTutorial);
    }

    function maybeTutorial() {
      if (settings.skipTutorial) return;
      tutorialStep = 0;
      showTutorial();
    }

    function tutorialSteps() {
      return [
        ["你的身份", "你是一个试用期大厂运营鼠鼠，刚搬进城中村出租屋。白天要给公司当牛马，晚上还要照顾自己的房间。"],
        ["试玩节奏", "Demo 从 9 月入职培训开始，体验 1 个月。每月 28 天，最后一天结束后会发工资并结算房租水电，然后进入结局。"],
        ["状态", "选择会影响现金、发量、心态、上级评价、同事印象和整洁。白天主要看上级评价，夜晚和周末更容易影响整洁。"],
        ["隐藏规则", "每天白天开始会扣 25 元日常开销。手头现金如果不够多，鼠鼠会焦虑地掉心态；现金小于 0 会直接进入破产结局。"],
        ["存档", "游戏会自动保存。你也可以随时点右上角“存档退出”，下次从主界面的“继续存档”回来。"]
      ];
    }

    function showTutorial() {
      const steps = tutorialSteps();
      const [title, text] = steps[tutorialStep];
      document.getElementById("tutorialTitle").textContent = title;
      document.getElementById("tutorialText").textContent = text;
      document.getElementById("tutorialNextBtn").textContent = tutorialStep >= steps.length - 1 ? "开始" : "下一步";
      document.getElementById("tutorialModal").classList.remove("hidden");
    }

    function nextTutorial() {
      tutorialStep += 1;
      if (tutorialStep >= tutorialSteps().length) {
        document.getElementById("tutorialModal").classList.add("hidden");
        return;
      }
      showTutorial();
    }

    function openSettings() {
      saveSettings();
      document.getElementById("settingsModal").classList.remove("hidden");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.add("hidden");
    }

    function clearSave() {
      storageRemove(saveKey);
      document.getElementById("continueBtn").disabled = true;
      showToast("本地存档已清除。");
    }

    function saveAndExit() {
      saveGame();
      document.getElementById("game").classList.add("hidden");
      document.getElementById("menuScreen").classList.remove("hidden");
      document.getElementById("result").classList.remove("show");
    }

    function toggleSkipTutorial() {
      settings.skipTutorial = !settings.skipTutorial;
      saveSettings();
    }

    function boot() {
      document.getElementById("continueBtn").disabled = !storageGet(saveKey);
      saveSettings();
    }

    function updateStatsOnly() {
      document.getElementById("monthText").textContent = dateText();
      document.getElementById("cashText").textContent = state.cash;
      document.getElementById("healthText").textContent = state.health;
      document.getElementById("moodText").textContent = state.mood;
      document.getElementById("peerText").textContent = state.peer;
      document.getElementById("cleanText").textContent = state.clean;
      updateStatEmphasis();
    }

    function updateStatEmphasis() {
      const workCard = document.querySelector(".stat-work");
      const cleanCard = document.querySelector(".stat-clean");
      const workActive = ["life", "dayWork", "tea", "monthEnd"].includes(state.phase);
      const cleanActive = ["night", "toNight", "weekend"].includes(state.phase) || state.nightMouse;
      workCard?.classList.toggle("is-muted", !workActive);
      cleanCard?.classList.toggle("is-muted", !cleanActive);
    }

    function setHint(title, text) {
      document.getElementById("hintTitle").textContent = title;
      document.getElementById("hintText").textContent = text;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function getDistance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function signed(value) {
      return value > 0 ? `+${value}` : `${value}`;
    }

    function bindPress(id, handler) {
      const el = document.getElementById(id);
      let touched = false;
      el.addEventListener("touchend", (event) => {
        event.preventDefault();
        touched = true;
        handler(event);
        setTimeout(() => touched = false, 350);
      }, { passive: false });
      el.addEventListener("click", (event) => {
        if (touched) return;
        handler(event);
      });
    }

    bindPress("saveExitBtn", saveAndExit);
    bindPress("againBtn", nextStep);
    bindPress("newGameBtn", resetAllToMenu);
    bindPress("continueBtn", () => {
      if (!loadGame()) showToast("没有可用存档。");
    });
    bindPress("settingsBtn", openSettings);
    bindPress("closeSettingsBtn", closeSettings);
    bindPress("clearSaveBtn", clearSave);
    bindPress("skipTutorialBtn", toggleSkipTutorial);
    bindPress("tutorialNextBtn", nextTutorial);
    window.addEventListener("keydown", (event) => {
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      if (state.phase !== "night" || currentEvent().type !== "shop" || !map[event.key]) return;
      event.preventDefault();
      moveShop(map[event.key]);
    });

    boot();
  </script>
</body>
</html>
